      const kicker = (txt, y = 0.55) => txt && sl.addText(plain(txt).toUpperCase(), { x: M, y, w: 9, h: 0.4, fontFace: BF, fontSize: 13, bold: true, color: T.acc, charSpacing: 3 });
      const title = (txt, y = 0.95, h = 1.1, size = 36) => sl.addText(plain(txt), { x: M, y, w: W - 2 * M, h, fontFace: HF, fontSize: size, color: T.ink, valign: 'top', fit: 'shrink' });
      const card = (x, y, w, h) => sl.addShape(pptx.ShapeType.roundRect, { x, y, w, h, rectRadius: 0.12, fill: { color: T.card }, line: { color: T.dark ? T.card : 'E4E4E7', width: 1 } });
      if (L !== 'portada') {
        sl.addImage({ data: logo, x: M, y: H - 0.48, w: 0.22, h: 0.3 });

      }

      switch (L) {

          if (s.subtitle) sl.addText(plain(s.subtitle), { x: M, y: 4.4, w: 8.4, h: 1, fontFace: BF, fontSize: 20, color: T.muted, valign: 'top', fit: 'shrink' });
          sl.addImage({ data: logo, x: M, y: 6.1, w: 0.5, h: 0.68 });
          sl.addText([{ text: 'Liceo Bicentenario Politécnico de Ovalle', options: { bold: true, breakLine: true } }, { text: 'Departamento de Educación Física' }], { x: M + 0.65, y: 6.1, w: 6, h: 0.7, fontFace: BF, fontSize: 12, color: T.ink });

    }

    let got = 0;
    const on = key => snap => {
      clearTimeout(t);

      if (++got >= 2 || S.loaded) { S.loaded = true; S.loadErr = false; }

    this.db.collection('decks').onSnapshot(on('decks'), fail);
    this.db.collection('instruments').onSnapshot(on('insts'), fail);
  },
  async put(obj) {
    const data = clone(obj); delete data.id; delete data._logo;

    if (!data.authorId && S.user.id) data.authorId = S.user.id;

    if (isBullet) cur.bullets.push(l.replace(/^([-•*]|\d+[.)])\s+/, '')); else cur.paras.push(l);
  });
  blocks.slice(0, Math.max(1, o.n - 5)).forEach(b => {
    if (b.bullets.length >= 2) sl.push({ layout: b.bullets.length <= 6 ? 'lista' : 'cierre', kicker: topic, title: b.title, cards: b.bullets.slice(0, 6).map(t => { const m = t.split(/:\s+/); return m.length > 1 ? { title: m[0], text: m.slice(1).join(': ') } : { title: t.split(' ').slice(0, 4).join(' '), text: t }; }), items: b.bullets.slice(0, 6), notes: b.paras.join(' ') });
    else sl.push({ layout: 'concepto', kicker: topic, title: b.title, body: b.paras.join(' ').slice(0, 300), highlight: b.title.split(' ')[0], highlightLabel: '', notes: b.paras.join(' ') });
  });
  if (!blocks.length) sl.push({ layout: 'concepto', kicker: topic, title: '¿Qué es?', body: 'Escribe aquí la definición principal.', highlight: topic.split(' ')[0], highlightLabel: '', notes: '' });
  if (o.activity) sl.push({ ...Slides.blank('actividad'), title: 'Actividad práctica', body: 'Describe la organización del curso y la tarea motriz.' });
  sl.push({ layout: 'cierre', kicker: 'Para recordar', title: 'Síntesis', items: blocks.slice(0, 4).map(b => b.title), body: '', notes: '' });
  if (o.ticket) sl.push({ layout: 'ticket', title: 'Ticket de salida', items: [`Define con tus palabras: ${topic.toLowerCase()}.`, '¿Qué aprendiste hoy que puedas aplicar fuera del liceo?', '¿Qué te costó más en la actividad práctica?'], notes: '' });

}

function checks(i) {
  const tot = Core.totalPoints(i);
  const isTest = ['prueba', 'guia'].includes(i.type);
  const out = [];
  const add = (ok, t, d) => out.push({ s: ok === true ? 'ok' : ok === 'warn' ? 'warn' : 'bad', t, d });
  add(true, 'Membrete e insignia del liceo', 'Encabezado institucional 3×2 incluido automáticamente.');
  add(!!(i.oa && i.oa.text && i.showOA !== false) || 'warn', 'Objetivo de Aprendizaje', i.oa && i.oa.text ? `${i.oa.code} del programa vigente.` : 'Falta el OA.');
  add(i.evalObjective ? true : 'warn', 'Objetivo de evaluación', i.evalObjective ? 'Redactado.' : 'Propón uno en el paso 3.');
  add(i.indicators.filter(Boolean).length ? true : false, 'Indicadores o criterios de evaluación', `${i.indicators.filter(Boolean).length} indicador(es).`);
  const insTxt = i.instructions.join(' ').toLowerCase();
  add(i.instructions.filter(Boolean).length && /minut/.test(insTxt) ? true : 'warn', 'Instrucciones con tiempo y carácter', /minut/.test(insTxt) ? `Carácter ${i.character.toLowerCase()} en el encabezado; tiempo indicado.` : 'Agrega el tiempo disponible en las instrucciones.');
  add(tot > 0 ? true : false, 'Puntaje máximo y corte de aprobación', tot > 0 ? (graded(i) ? `${tot} ptos = 7,0 · ${Core.cutPoints(tot, i.exigencia)} ptos (${i.exigencia}%) = 4,0.` : `${tot} ptos · logro mínimo ${Core.cutPoints(tot, i.exigencia)} ptos (${i.exigencia}%). Sin notas por ser ${i.character.toLowerCase()}.`) : 'El instrumento aún no tiene puntaje.');
  if (isTest || i.type === 'ticket') {

function localGen(i) {

    if (g.texto) secs.push(blankSection('texto'));
    fill('seleccion', g.seleccion, ['inicial', 'inicial', 'intermedio']);
    fill('vf', g.vf, ['inicial', 'inicial', 'intermedio']);

  'rm-ind': el => { S.inst.indicators.splice(+el.dataset.i, 1); scheduleSave(S.inst); render(); },
  'ai-obj': () => runObjAI(),
  'local-obj': () => { localObjective(S.inst); scheduleSave(S.inst); render(); },
  'ai-gen': () => runGenAI(),
  'local-gen': () => { localGen(S.inst); scheduleSave(S.inst); render(); },
  'add-sec': el => { S.inst.sections.push(blankSection(el.dataset.v)); scheduleSave(S.inst); render(); },
  'rm-sec': el => { S.inst.sections.splice(+el.dataset.si, 1); scheduleSave(S.inst); render(); },
  'mv-sec': el => { const a = S.inst.sections, k = +el.dataset.si, j = k + +el.dataset.d; if (j < 0 || j >= a.length) return; [a[k], a[j]] = [a[j], a[k]]; scheduleSave(S.inst); render(); },
  'add-q': el => { const s = S.inst.sections[+el.dataset.si]; if (s.type === 'pareados') s.pairs.push({ a: '', b: '' }); else s.questions.push(clone(blankSection(s.type).questions[0])); scheduleSave(S.inst); render(); },
  'rm-q': el => { const s = S.inst.sections[+el.dataset.si]; (s.type === 'pareados' ? s.pairs : s.questions).splice(+el.dataset.k, 1); scheduleSave(S.inst); render(); },
  'mv-q': el => { const a = S.inst.sections[+el.dataset.si].questions, k = +el.dataset.k, j = k + +el.dataset.d; if (j < 0) return; [a[k], a[j]] = [a[j], a[k]]; scheduleSave(S.inst); render(); },
  'set-lvl': el => { setPath(S.inst, el.dataset.path + '.level', el.dataset.v); scheduleSave(S.inst); render(); },
  'set-ans': el => { setPath(S.inst, el.dataset.path + '.answer', +el.dataset.v); scheduleSave(S.inst); },
  'set-vf': el => { setPath(S.inst, el.dataset.path + '.answer', el.dataset.v === '1'); scheduleSave(S.inst); render(); },
  'vf-layout': el => { S.inst.sections[+el.dataset.si].layout = el.dataset.v; scheduleSave(S.inst); render(); },
  'add-crit': () => { S.inst.rubric.criteria.push({ name: '', descriptors: S.inst.rubric.levels.map(() => '') }); scheduleSave(S.inst); render(); },
  'rm-crit': el => { S.inst.rubric.criteria.splice(+el.dataset.k, 1); scheduleSave(S.inst); render(); },
  'add-col': () => { S.inst.checklist.cols.push({ name: 'Nueva', points: 0 }); scheduleSave(S.inst); render(); },
  'rm-col': el => { if (S.inst.checklist.cols.length <= 2) return toast('Se necesitan al menos dos columnas.'); S.inst.checklist.cols.splice(+el.dataset.i, 1); scheduleSave(S.inst); render(); },
  'add-item': () => { S.inst.checklist.items.push({ text: '' }); scheduleSave(S.inst); render(); },
  'rm-item': el => { S.inst.checklist.items.splice(+el.dataset.i, 1); scheduleSave(S.inst); render(); },
  'ai-review': () => runReviewAI(),
  'export-all': () => { const data = { app: 'estudio-efys', version: 1, exportedAt: new Date().toISOString(), decks: S.decks, instruments: S.insts }; saveFile(`Respaldo_EstudioEFyS_${new Date().toISOString().slice(0, 10)}.json`, new Blob([JSON.stringify(data)], { type: 'application/json' })); },
  'share-file': el => { const o = el.dataset.k === 'deck' ? S.deck : S.inst; const data = { app: 'estudio-efys', version: 1, [o.kind === 'deck' ? 'decks' : 'instruments']: [o] }; saveFile(safeName(o.kind === 'deck' ? o.title : (o.subtitle || o.title)) + '.efys.json', new Blob([JSON.stringify(data)], { type: 'application/json' })); },
  'ai-tech': () => { const t = $('#ai-ins'); if (t) t.value = 'Eleva el vocabulario a un registro técnico-profesional de las ciencias de la actividad física y la salud (fisiología del ejercicio, biomecánica, teoría del entrenamiento), con definiciones rigurosas y comprensibles para enseñanza media.'; runSlideAI(); },
  'del-deck': () => confirmBox('Eliminar presentación', 'Se eliminará de la biblioteca del departamento para todos. Esta acción no se puede deshacer.', 'Eliminar', async () => { const d = S.deck; clearTimeout(saver.t[d.id]); try { await Store.remove(d); } catch { toast('No se pudo eliminar.'); return; } S.deck = null; go('presentaciones'); toast('Presentación eliminada'); }),
  docx: () => exportDocx(),
  'dup-inst': () => { const c = clone(S.inst); c.id = uid(); c.subtitle = (c.subtitle || c.title) + ' (copia)'; c.status = 'borrador'; c.authorId = S.user.id || null; c.createdAt = Date.now(); S.inst = c; scheduleSave(c); render(); toast('Copia creada'); },
  'del-inst': () => confirmBox('Eliminar instrumento', 'Se eliminará de la biblioteca del departamento para todos. Esta acción no se puede deshacer.', 'Eliminar', async () => { const i = S.inst; clearTimeout(saver.t[i.id]); try { await Store.remove(i); } catch { toast('No se pudo eliminar.'); return; } S.inst = null; go('instrumentos'); toast('Instrumento eliminado'); })
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = ACTIONS[el.dataset.act];
  if (!a) return;
  if (el.tagName === 'INPUT' && el.type === 'radio') { a(el, ev); return; }
  ev.preventDefault(); a(el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.form === 'nd') {
    const k = el.dataset.k; NEWDECK[k] = el.type === 'checkbox' ? el.checked : el.value;
    if (k === 'n') { const v = $('#nd-nv'); if (v) v.textContent = el.value; }
    return;
  }
  if (el.dataset.actInput === 'search') { S.q = el.value; const pos = el.selectionStart; render(); const n = $('[data-act-input="search"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch { } } return; }
  const b = el.dataset.bind; if (!b) return;
  const [scope, path] = [b.slice(0, b.indexOf(':')), b.slice(b.indexOf(':') + 1)];
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.num !== undefined && v !== '') v = Number(v);
  if (scope === 'slide') { setPath(curSlide(), path, v); refreshSlide(false); }
  else if (scope === 'deck') { setPath(S.deck, path, v); scheduleSave(S.deck); }
  else if (scope === 'inst') {
    setPath(S.inst, path, v); scheduleSave(S.inst);
    if (el.dataset.rerender !== undefined || el.type === 'checkbox') { if (el.dataset.nopreview === undefined) render(); }
    else if (el.dataset.nopreview === undefined) refreshPaper();
    if (/^(sections|rubric|checklist)/.test(path) && el.dataset.num !== undefined) { const ptsEl = document.querySelector('.paper-wrap .split .small'); if (ptsEl) ptsEl.textContent = Core.totalPoints(S.inst) + ' ptos'; }
  }
});
document.addEventListener('change', async ev => {
  const el = ev.target;
  if (el.dataset.form === 'nd' && ['course', 'program', 'oaId'].includes(el.dataset.k)) {
    NEWDECK[el.dataset.k] = el.value;
    const f = $('#nd-fields'); if (f) f.innerHTML = courseFields(NEWDECK, 'nd');
    const oa = oaById(NEWDECK.oaId); const t = $('#nd-topics'); if (t && oa) t.innerHTML = (oa.topics || []).map(x => `<button class="chip" data-act="pick-topic" data-t="${esc(x)}">${esc(x)}</button>`).join('');
    return;
  }
  if (el.dataset.filter) { S[el.dataset.filter] = el.value; render(); return; }
  const a = el.dataset.actChange;
  if (a === 'inst-course') { const i = S.inst; i.courseLabel = el.value; i.level = levelForCourse(el.value, i.program); const o = levelById(i.level).oas.find(x => x.n === (oaById(i.oaId)?.n || 3)) || levelById(i.level).oas[0]; i.oaId = o.id; i.oa = { code: oaCode(o), text: o.text }; scheduleSave(i); render(); }
  if (a === 'inst-prog') { const i = S.inst; i.program = el.value; i.level = el.value; const o = levelById(i.level).oas.find(x => x.n === (oaById(i.oaId)?.n || 3)) || levelById(i.level).oas[0]; i.oaId = o.id; i.oa = { code: oaCode(o), text: o.text }; scheduleSave(i); render(); }
  if (a === 'x-key') S.xKey = el.checked;
  if (a === 'x-tab') S.xTab = el.checked;
  if (el.dataset.actFile === 'import' && el.files && el.files[0]) {
    try {
      const data = JSON.parse(await el.files[0].text());
      const list = [...(data.decks || []).map(x => ({ ...x, kind: 'deck' })), ...(data.instruments || []).map(x => ({ ...x, kind: 'instrument' }))].filter(x => x && x.id);
      if (data.app !== 'estudio-efys' || !list.length) throw 0;
      let n = 0;
      for (const o of list) { const key = o.kind === 'deck' ? 'decks' : 'insts'; const cur = S[key].find(x => x.id === o.id); if (cur && (cur.updatedAt || 0) >= (o.updatedAt || 0)) continue; await Store.put(clone(o)); n++; }
      if (S.mode !== 'db') refreshLists();
      toast(n ? `Se importaron ${n} documento(s).` : 'Los documentos ya estaban al día.');
    } catch { toast('El archivo no es un respaldo de Estudio EFyS.'); }
    el.value = ''; return;
  }
  if (el.dataset.actFile === 'slide-image' && el.files && el.files[0]) {
    const as = await assetsCap; if (!as) return toast('La subida de imágenes no está disponible.');
    toast('Subiendo imagen…');
    try { const r = await as.upload(el.files[0]); curSlide().image = r.url; refreshSlide(true); toast('Imagen agregada'); }
    catch (e) { toast('No se pudo subir la imagen.'); }
  }
});
document.addEventListener('keydown', ev => {
  if ($('#present')) {
    if (['ArrowRight', 'PageDown', ' '].includes(ev.key)) { ev.preventDefault(); ACTIONS['p-next'](); }
    else if (['ArrowLeft', 'PageUp'].includes(ev.key)) { ev.preventDefault(); ACTIONS['p-prev'](); }
    else if (ev.key === 'Escape') exitPresent();
    return;
  }
  if (ev.key === 'Escape' && $('#modal')) closeModal();
});
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && $('#present')) fitScalers(); });
window.addEventListener('resize', () => { fitScalers(); fitPaper(); });

/* ---------------- Arranque ---------------- */
(function boot() {
  const h = (location.hash || '').replace('#', '');
  if (['inicio', 'presentaciones', 'instrumentos', 'curriculo'].includes(h)) S.view = h;
  render();
  Store.init();
  sampleCap.then(s => { S.aiOn = !!s || !EMBED; render(); });
  assetsCap.then(a => { S.assets = a; if (S.view === 'deck') render(); });
  userCap.then(async u => { if (!u) return; try { const me = await u.me(); S.user = { id: me.id, name: me.name || '' }; } catch { } render(); resolveNames(); });
})();
window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (['inicio', 'presentaciones', 'instrumentos', 'curriculo'].includes(h) && S.view !== h) go(h); });

</script>
</body>
