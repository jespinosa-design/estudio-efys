<style>
/* Layout: barra lateral fija + área de trabajo en rejilla "bento"; editores en 3 columnas (lista · lienzo · panel) */
:root {
  --bg: #fafafa; --surface: #ffffff; --surface-2: #f4f4f5; --border: rgba(228,228,231,.85); --border-strong: #d4d4d8;
  --ink: #18181b; --ink-2: #3f3f46; --muted: #71717a; --faint: #a1a1aa;
  --accent: #144c99; --accent-ink: #ffffff; --accent-soft: #e8eff9; --accent-line: #bfd2ee; --accent-text: #144c99;
  --orange: #dd7d0c; --orange-soft: #fdf1e3; --orange-text: #a65c06;
  --side-bg: #144c99; --side-ink: #ffffff; --side-muted: rgba(255,255,255,.68); --side-hover: rgba(255,255,255,.08); --side-active: rgba(255,255,255,.14); --side-line: rgba(255,255,255,.14);
  --ok: #15803d; --ok-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7; --bad: #b91c1c; --bad-soft: #fee2e2;
  --hover: #f4f4f5; --shadow: 0 1px 2px rgba(24,24,27,.05);
  --stage: #e4e4e7; --paper-shadow: 0 1px 3px rgba(24,24,27,.12), 0 8px 24px rgba(24,24,27,.06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --f-sport: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-doc: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  --r: 12px; --r-sm: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #09090b; --surface: #18181b; --surface-2: #1f1f23; --border: #27272a; --border-strong: #3f3f46;
  --ink: #fafafa; --ink-2: #d4d4d8; --muted: #a1a1aa; --faint: #71717a;
  --accent: #2f6bc4; --accent-ink: #ffffff; --accent-soft: rgba(47,107,196,.2); --accent-line: rgba(96,148,222,.45); --accent-text: #9cc0f0;
  --orange: #ec8d1f; --orange-soft: rgba(236,141,31,.15); --orange-text: #f5b062;
  --side-bg: #0c2a57; --side-ink: #ffffff; --side-muted: rgba(255,255,255,.62); --side-hover: rgba(255,255,255,.07); --side-active: rgba(255,255,255,.12); --side-line: rgba(255,255,255,.1);
  --ok: #4ade80; --ok-soft: rgba(34,197,94,.15); --warn: #fbbf24; --warn-soft: rgba(245,158,11,.15); --bad: #f87171; --bad-soft: rgba(239,68,68,.15);
  --hover: #202024; --shadow: 0 1px 2px rgba(0,0,0,.4); --stage: #111113; --paper-shadow: 0 2px 10px rgba(0,0,0,.5);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #09090b; --surface: #18181b; --surface-2: #1f1f23; --border: #27272a; --border-strong: #3f3f46;
  --ink: #fafafa; --ink-2: #d4d4d8; --muted: #a1a1aa; --faint: #71717a;
  --accent: #2f6bc4; --accent-ink: #ffffff; --accent-soft: rgba(47,107,196,.2); --accent-line: rgba(96,148,222,.45); --accent-text: #9cc0f0;
  --orange: #ec8d1f; --orange-soft: rgba(236,141,31,.15); --orange-text: #f5b062;
  --side-bg: #0c2a57; --side-ink: #ffffff; --side-muted: rgba(255,255,255,.62); --side-hover: rgba(255,255,255,.07); --side-active: rgba(255,255,255,.12); --side-line: rgba(255,255,255,.1);
  --ok: #4ade80; --ok-soft: rgba(34,197,94,.15); --warn: #fbbf24; --warn-soft: rgba(245,158,11,.15); --bad: #f87171; --bad-soft: rgba(239,68,68,.15);
  --hover: #202024; --shadow: 0 1px 2px rgba(0,0,0,.4); --stage: #111113; --paper-shadow: 0 2px 10px rgba(0,0,0,.5);
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--side-bg); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 4px; padding: 20px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--side-line); background: var(--side-bg); color: var(--side-ink); }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 18px; }
.brand img { width: 30px; height: auto; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: -.02em; display: block; line-height: 1.05; }
.brand span { color: var(--side-muted); font-size: 11.5px; font-weight: 500; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: var(--r-sm); color: var(--side-muted); font-weight: 600; font-size: 13.5px; cursor: pointer; text-align: left; transition: background .15s, color .15s; }
.nav-btn:hover { background: var(--side-hover); color: var(--side-ink); }
.nav-btn[aria-current="page"] { background: var(--side-active); color: var(--side-ink); box-shadow: inset 3px 0 0 var(--orange); }
.nav-btn svg { width: 18px; height: 18px; flex: none; }
.nav-btn .count { margin-left: auto; font-size: 11.5px; color: var(--side-muted); font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; display: grid; gap: 8px; padding: 12px 8px 0; border-top: 1px solid var(--side-line); }
.side-foot .btn { background: transparent; border-color: var(--side-line); color: var(--side-ink); }
.side-foot .btn:hover { background: var(--side-hover); }
.who { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--orange); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.who small { display: block; color: var(--side-muted); font-size: 11.5px; }
.status-line { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--side-muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.on { background: var(--ok); } .dot.warn { background: var(--warn); }

.main { min-width: 0; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 24px; padding: 0 12px; }
.wrap.wide { max-width: 1600px; }

.topbar { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--side-bg); border-bottom: 1px solid var(--side-line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); gap: 6px; align-items: center; overflow-x: auto; }
  .topbar img { width: 24px; margin-right: 6px; }
  .topbar .nav-btn { width: auto; white-space: nowrap; padding: 7px 10px; }
  .main { padding-top: 18px; }
  .wrap { padding: 0; }
}

/* ---------- Tipografía y piezas ---------- */
.eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 3.2vw, 36px); letter-spacing: -.035em; line-height: 1.05; color: var(--ink); }
.h2 { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
.h3 { font-weight: 700; font-size: 14.5px; }
.sub { color: var(--muted); font-size: 14px; font-weight: 500; max-width: 68ch; }
.small { font-size: 12.5px; color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 12px; }
.page-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.page-head > div { display: grid; gap: 6px; min-width: 0; }
.page-head > div:first-child { flex: 1 1 340px; }
.page-head .btn.ghost.sm { justify-self: start; margin-left: -10px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 24px; box-shadow: var(--shadow); min-width: 0; }
.card.pad-s { padding: 16px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); border-radius: var(--r-sm); padding: 8px 14px; font-weight: 600; font-size: 13.5px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn.icon { padding: 6px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); white-space: nowrap; }
.chip.org { background: var(--orange-soft); color: var(--orange-text); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-line); }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent-line); color: var(--accent-text); }

/* Formularios */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--muted); }
.inp, .sel, .ta { width: 100%; border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--r-sm); padding: 8px 10px; font-size: 13.5px; transition: border-color .15s, box-shadow .15s; }
.ta { resize: vertical; min-height: 64px; line-height: 1.45; }
.inp:focus, .sel:focus, .ta:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; font-weight: 600; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }

/* ---------- Inicio (bento) ---------- */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; }
.b-hero { grid-column: span 8; display: grid; gap: 22px; align-content: space-between; position: relative; overflow: hidden; }
.b-hero .h1 { font-size: clamp(28px, 3.6vw, 42px); max-width: 18ch; }
.b-hero .lanes { position: absolute; right: -40px; bottom: -60px; width: 340px; height: 260px; pointer-events: none; opacity: .9; }
.b-hero .actions { display: flex; flex-wrap: wrap; gap: 10px; position: relative; align-items: center; }
.b-rules { grid-column: span 4; }
.kpi { grid-column: span 3; display: grid; gap: 4px; }
.kpi .v { font-family: var(--f-display); font-size: 40px; font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 13px; color: var(--muted); font-weight: 500; }
.kpi .t { font-size: 12px; color: var(--muted); margin-top: 8px; }
.b-due { grid-column: span 7; }
.b-mix { grid-column: span 5; }
.b-recent { grid-column: span 12; }
@media (max-width: 1100px) { .b-hero, .b-rules, .b-due, .b-mix { grid-column: span 12; } .kpi { grid-column: span 6; } }
@media (max-width: 520px) { .kpi { grid-column: span 12; } .bento { gap: 16px; } }
.rules { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.rules li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: baseline; font-size: 13px; color: var(--ink-2); }
.rules b { font-family: var(--f-display); font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.list { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: var(--r-sm); cursor: pointer; transition: background .15s; border: 0; background: none; width: 100%; text-align: left; }
.row:hover { background: var(--hover); }
.row + .row { border-top: 1px solid var(--border); }
.row .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.row .ic svg { width: 17px; height: 17px; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .m { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 34px 16px; color: var(--muted); }
.empty svg { width: 40px; height: 40px; color: var(--faint); }
.empty b { color: var(--ink); font-size: 14.5px; }
.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 128px 1fr 28px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar-row .track { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar-row .fill { height: 100%; border-radius: 99px; background: var(--accent); }
.bar-row .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---------- Listados ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .inp { max-width: 280px; }
.deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
.deck-card { padding: 0; overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s; text-align: left; }
.deck-card:hover { border-color: var(--accent-line); transform: translateY(-2px); }
.deck-card .thumb { aspect-ratio: 16/9; position: relative; overflow: hidden; background: var(--stage); border-bottom: 1px solid var(--border); }
.deck-card .meta { padding: 14px 16px; display: grid; gap: 6px; }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tbody tr { cursor: pointer; transition: background .15s; }
.tbl tbody tr:hover { background: var(--hover); }
.tbl .tt { font-weight: 600; } .tbl .mm { font-size: 12px; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Escenario de diapositivas ---------- */
.scaler { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; }
.scaler > .sl { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.deck-ed { display: grid; grid-template-columns: 188px minmax(0,1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 1280px) { .deck-ed { grid-template-columns: 150px minmax(0,1fr) 300px; } }
@media (max-width: 1000px) { .deck-ed { grid-template-columns: 1fr; } .rail { order: 2; } .insp { order: 3; } }
.rail { display: grid; gap: 10px; max-height: calc(100vh - 140px); overflow-y: auto; padding: 2px 6px 2px 2px; }
@media (max-width: 1000px) { .rail { grid-auto-flow: column; grid-auto-columns: 150px; overflow-x: auto; max-height: none; } }
.thumb-btn { display: grid; grid-template-columns: 18px 1fr; gap: 6px; align-items: start; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
.thumb-btn .n { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; text-align: right; }
.thumb-btn .scaler { border-radius: 6px; border: 2px solid transparent; outline: 1px solid var(--border); transition: border-color .15s; }
.thumb-btn[aria-current="true"] .scaler { border-color: var(--accent); outline-color: transparent; }
.stage-wrap { display: grid; gap: 12px; min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.stage { border-radius: 10px; overflow: hidden; box-shadow: var(--paper-shadow); }
.stage-bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.insp { display: grid; gap: 16px; }
.insp .card { padding: 18px; display: grid; gap: 14px; }
.layout-pick { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.layout-pick button { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 4px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.layout-pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
.sub-list { display: grid; gap: 8px; }
.sub-item { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: start; }
.sub-item .stack { display: grid; gap: 6px; }
.theme-pick { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.theme-pick button { border: 2px solid var(--border); border-radius: 10px; padding: 0; overflow: hidden; background: none; cursor: pointer; text-align: left; }
.theme-pick button[aria-pressed="true"] { border-color: var(--accent); }
.theme-pick .sw { height: 46px; display: flex; align-items: flex-end; gap: 4px; padding: 8px; }
.theme-pick .sw i { width: 14px; height: 14px; border-radius: 50%; display: block; }
.theme-pick .nm { padding: 6px 9px; font-size: 12px; font-weight: 600; background: var(--surface); }

/* Diapositiva 1280×720 */
.sl { width: 1280px; height: 720px; position: relative; overflow: hidden; background: var(--s-bg); color: var(--s-ink); font-family: var(--f-body); }
.sl .deco { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.sl .s-in { position: absolute; inset: 64px 84px 84px; display: flex; flex-direction: column; gap: 18px; }
.sl b { color: var(--s-acc); font-weight: 700; }
.th-pista { --s-bg: #144c99; --s-ink: #fff; --s-muted: #c3d5f0; --s-acc: #f39a2e; --s-acc2: #ffd23f; --s-card: #1d5aaf; --s-line: rgba(255,255,255,.12); --s-tf: var(--f-sport); --s-tt: uppercase; --s-tw: 800; --s-ls: 0; }
.th-cancha { --s-bg: #0e3b2e; --s-ink: #f3fff8; --s-muted: #a7d3bf; --s-acc: #c6f432; --s-acc2: #fff; --s-card: #154a3a; --s-line: rgba(255,255,255,.14); --s-tf: var(--f-sport); --s-tt: uppercase; --s-tw: 800; --s-ls: 0; }
.th-tiza { --s-bg: #f5f6fa; --s-ink: #161a2e; --s-muted: #5b6178; --s-acc: #4f46e5; --s-acc2: #f39200; --s-card: #fff; --s-line: #e4e4e7; --s-tf: var(--f-display); --s-tt: none; --s-tw: 800; --s-ls: -.03em; }
.th-pulso { --s-bg: #111114; --s-ink: #f7f7f8; --s-muted: #a1a1aa; --s-acc: #ff5a4e; --s-acc2: #ffb84d; --s-card: #1e1e23; --s-line: rgba(255,255,255,.1); --s-tf: var(--f-sport); --s-tt: uppercase; --s-tw: 800; --s-ls: .01em; }
.sl .s-kicker { font-size: 19px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--s-acc); }
.sl .s-title { font-family: var(--s-tf); font-weight: var(--s-tw); text-transform: var(--s-tt); letter-spacing: var(--s-ls); font-size: 64px; line-height: .98; max-width: 1000px; }
.th-tiza .s-title { font-size: 54px; line-height: 1.05; }
.sl .s-lead { font-size: 30px; line-height: 1.35; color: var(--s-ink); max-width: 980px; }
.sl .s-body { font-size: 25px; line-height: 1.45; color: var(--s-muted); max-width: 760px; }
.sl .s-label { font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--s-acc); }
.sl .s-card { background: var(--s-card); border: 1px solid var(--s-line); border-radius: 18px; }
.th-tiza .s-card { box-shadow: 0 1px 2px rgba(22,26,46,.06); }
.sl .tick { width: 22px; height: 22px; border-radius: 50%; background: var(--s-acc); flex: none; position: relative; margin-top: 6px; }
.sl .tick::after { content: ""; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px; border: solid var(--s-bg); border-width: 0 3px 3px 0; transform: rotate(45deg); }
.sl .s-foot { position: absolute; left: 84px; right: 84px; bottom: 28px; display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--s-muted); font-weight: 600; }
.sl .s-foot img { height: 30px; width: auto; }
.sl .s-num { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: .08em; }
.sl .s-img { border-radius: 18px; overflow: hidden; background: var(--s-card); }
.sl .s-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* portada */
.ly-portada .s-in { inset: 0; padding: 92px 96px; justify-content: space-between; }
.ly-portada .p-wrap { display: grid; gap: 26px; max-width: 820px; margin-top: 40px; }
.ly-portada .s-chip { justify-self: start; border: 2px solid var(--s-acc); color: var(--s-acc); border-radius: 999px; padding: 6px 18px; font-weight: 700; font-size: 18px; letter-spacing: .1em; text-transform: uppercase; }
.ly-portada .s-mega { font-family: var(--s-tf); font-weight: var(--s-tw); text-transform: var(--s-tt); letter-spacing: var(--s-ls); font-size: 124px; line-height: .9; }
.th-tiza.ly-portada .s-mega { font-size: 96px; line-height: 1; }
.ly-portada .s-sub { font-size: 30px; color: var(--s-muted); line-height: 1.3; max-width: 760px; }
.ly-portada .p-brand { display: flex; gap: 16px; align-items: center; font-size: 17px; }
.ly-portada .p-brand img { height: 64px; width: auto; }
.ly-portada .p-brand b { display: block; color: var(--s-ink); font-weight: 700; }
.ly-portada .p-brand span { color: var(--s-muted); }
/* objetivo */
.o-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 48px; align-items: start; height: 100%; }
.o-grid > div:first-child { display: grid; gap: 22px; align-content: start; }
.o-crit { padding: 30px 32px; display: grid; gap: 18px; align-content: start; }
.o-crit ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.o-crit li { display: flex; gap: 14px; font-size: 23px; line-height: 1.35; }
/* concepto */
.c-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 56px; height: 100%; }
.c-text { display: grid; gap: 22px; align-content: center; }
.c-side { display: grid; min-height: 0; }
.c-hl { background: var(--s-acc); color: var(--s-bg); border-radius: 26px; display: grid; align-content: center; justify-items: center; gap: 16px; padding: 36px; text-align: center; }
.c-hl-v { font-family: var(--s-tf); font-weight: 900; text-transform: var(--s-tt); font-size: var(--hs, 92px); line-height: .92; letter-spacing: var(--s-ls); word-break: break-word; }
.c-hl-l { font-size: 22px; font-weight: 600; line-height: 1.3; }
.c-hl b { color: inherit; }
/* lista */
.l-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; flex: 1; align-content: start; margin-top: 10px; }
.l-grid.n1 { grid-template-columns: 1fr; } .l-grid.n2, .l-grid.n4 { grid-template-columns: repeat(2, 1fr); }
.l-card { padding: 26px 28px; display: grid; gap: 10px; align-content: start; }
.l-n { font-family: var(--s-tf); font-weight: 800; font-size: 34px; color: var(--s-acc); line-height: 1; }
.l-card h3 { font-size: 27px; font-weight: 700; line-height: 1.15; }
.l-card p { font-size: 20px; line-height: 1.4; color: var(--s-muted); }
.l-grid.n5 .l-card p, .l-grid.n6 .l-card p, .l-grid.n4 .l-card p { font-size: 18px; }
.l-grid.n5 .l-card, .l-grid.n6 .l-card { padding: 20px 24px; }
/* comparación */
.cmp { display: grid; grid-template-columns: 1fr 80px 1fr; gap: 0; flex: 1; align-items: stretch; margin-top: 10px; }
.cmp-col { padding: 30px; display: grid; gap: 16px; align-content: start; border-top: 6px solid var(--s-acc); }
.cmp-col.b { border-top-color: var(--s-acc2); }
.cmp-col h3 { font-family: var(--s-tf); text-transform: var(--s-tt); font-weight: 800; font-size: 38px; line-height: 1; }
.cmp-col ul { margin: 0; padding-left: 26px; display: grid; gap: 10px; font-size: 22px; line-height: 1.35; }
.cmp-col li::marker { color: var(--s-acc); }
.cmp-vs { display: grid; place-items: center; font-family: var(--s-tf); font-weight: 900; font-size: 34px; color: var(--s-acc); }
/* pasos */
.st-row { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 26px; margin-top: 30px; position: relative; }
.st { display: grid; gap: 12px; align-content: start; position: relative; }
.st-dot { width: 64px; height: 64px; border-radius: 50%; background: var(--s-acc); color: var(--s-bg); display: grid; place-items: center; font-family: var(--s-tf); font-weight: 900; font-size: 30px; position: relative; z-index: 1; }
.st:not(:last-child)::after { content: ""; position: absolute; top: 31px; left: 76px; right: -14px; border-top: 3px dashed var(--s-line); }
.th-tiza .st:not(:last-child)::after { border-top-color: #c7c9d6; }
.st h3 { font-size: 27px; font-weight: 700; line-height: 1.15; margin-top: 8px; }
.st p { font-size: 20px; line-height: 1.4; color: var(--s-muted); }
/* dato */
.d-wrap { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: center; height: 100%; }
.d-val { font-family: var(--s-tf); font-weight: 900; font-size: 230px; line-height: .85; color: var(--s-acc); letter-spacing: -.02em; word-break: break-word; }
.d-val b { color: inherit; }
.th-tiza .d-val { font-size: 190px; letter-spacing: -.05em; }
.d-txt { display: grid; gap: 18px; }
.d-lab { font-family: var(--s-tf); text-transform: var(--s-tt); font-weight: 800; font-size: 44px; line-height: 1; }
.d-src { font-size: 16px; color: var(--s-muted); font-style: italic; }
/* pregunta */
.q-mark { position: absolute; right: -10px; top: -150px; font-family: var(--s-tf); font-weight: 900; font-size: 760px; line-height: 1; color: var(--s-acc); opacity: .18; }
.q-wrap { display: grid; gap: 26px; align-content: center; height: 100%; max-width: 900px; position: relative; }
.q-title { font-family: var(--s-tf); text-transform: var(--s-tt); font-weight: var(--s-tw); letter-spacing: var(--s-ls); font-size: 80px; line-height: .98; }
.th-tiza .q-title { font-size: 64px; line-height: 1.05; }
/* actividad */
.a-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 48px; height: 100%; }
.a-grid > div:first-child { display: grid; gap: 20px; align-content: start; }
.a-img { height: 190px; }
.a-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-content: start; margin-top: 40px; }
.a-spec { padding: 20px 22px; display: grid; gap: 6px; }
.a-v { font-family: var(--s-tf); font-weight: 800; font-size: 36px; line-height: 1.05; text-transform: var(--s-tt); }
.th-tiza .a-v { font-size: 30px; }
/* ticket */
.ly-ticket .s-in { align-items: center; justify-content: center; }
.t-card { width: 960px; background: var(--s-card); border-radius: 24px; overflow: hidden; border: 1px solid var(--s-line); position: relative; }
.t-card::before, .t-card::after { content: ""; position: absolute; top: 112px; width: 44px; height: 44px; border-radius: 50%; background: var(--s-bg); }
.t-card::before { left: -22px; } .t-card::after { right: -22px; }
.t-head { background: var(--s-acc); color: var(--s-bg); padding: 26px 44px; display: grid; gap: 2px; }
.t-head span { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 16px; }
.t-head h2 { font-family: var(--s-tf); text-transform: var(--s-tt); font-weight: 900; font-size: 54px; line-height: 1; }
.t-list { margin: 0; padding: 30px 44px 34px 84px; display: grid; gap: 24px; font-size: 25px; line-height: 1.35; }
.t-list li::marker { color: var(--s-acc); font-weight: 800; }
.t-line { display: block; border-bottom: 2px dashed var(--s-line); height: 26px; }
.th-tiza .t-line { border-bottom-color: #c7c9d6; }
/* cita */
.qt { display: grid; gap: 22px; align-content: center; height: 100%; max-width: 1020px; }
.qt-mark { font-family: Georgia, serif; font-size: 220px; line-height: .6; color: var(--s-acc); height: 110px; }
.qt blockquote { margin: 0; font-family: var(--s-tf); font-weight: 700; font-size: 56px; line-height: 1.12; text-transform: none; letter-spacing: var(--s-ls); }
.qt-a { font-size: 24px; color: var(--s-muted); font-weight: 600; }
/* cierre */
.ci-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 40px; margin-top: 16px; }
.ci { display: flex; gap: 16px; font-size: 25px; line-height: 1.35; }
.ci-b { font-size: 22px; color: var(--s-muted); margin-top: auto; }

/* ---------- Modo presentación ---------- */
.present { position: fixed; inset: 0; z-index: 100; background: #000; display: grid; place-items: center; }
.present .scaler { width: min(100vw, calc(100vh * 16 / 9)); }
.present .pbar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 8px; padding: 14px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); opacity: 0; transition: opacity .2s; }
.present:hover .pbar { opacity: 1; }
.present .pbar button { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.present .pbar span { color: #fff; align-self: center; font-variant-numeric: tabular-nums; font-size: 13px; padding: 0 8px; }

/* ---------- Modal ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 80; background: rgba(9,9,11,.45); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.modal { width: min(760px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: grid; gap: 18px; padding: 26px; max-height: calc(100vh - 32px); overflow-y: auto; }
.modal-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.progress { display: grid; gap: 10px; padding: 18px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent-line); }
.progress .pt { display: flex; gap: 10px; align-items: center; font-weight: 600; color: var(--accent-text); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent-line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress pre { margin: 0; max-height: 120px; overflow: hidden; font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-all; mask-image: linear-gradient(transparent, #000 40%); -webkit-mask-image: linear-gradient(transparent, #000 40%); }

/* ---------- Editor de instrumentos ---------- */
.inst-ed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 1150px) { .inst-ed { grid-template-columns: 1fr; } }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); padding: 6px 12px 6px 6px; border-radius: 999px; font-weight: 600; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.step i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.step[aria-current="step"] { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
.step[aria-current="step"] i { background: var(--orange); color: #fff; }
.step.done i { background: var(--ok-soft); color: var(--ok); }
.pane { display: grid; gap: 18px; }
.oa-list { display: grid; gap: 10px; }
.oa-opt { display: grid; grid-template-columns: auto 1fr; gap: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--surface); cursor: pointer; text-align: left; transition: border-color .15s, background .15s; }
.oa-opt:hover { background: var(--hover); }
.oa-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.oa-code { font-family: var(--f-mono); font-size: 12px; font-weight: 500; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; height: fit-content; white-space: nowrap; }
.oa-opt[aria-pressed="true"] .oa-code { background: var(--accent); color: #fff; border-color: var(--accent); }
.oa-opt .oa-t { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.oa-opt .oa-s { font-weight: 700; font-size: 13.5px; color: var(--ink); display: block; margin-bottom: 2px; }
.type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.type-opt { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--surface); cursor: pointer; text-align: left; display: grid; gap: 6px; transition: border-color .15s, background .15s; }
.type-opt:hover { background: var(--hover); }
.type-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.type-opt svg { width: 20px; height: 20px; color: var(--accent-text); }
.type-opt b { font-size: 13.5px; } .type-opt span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.sec-card { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.sec-head { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.sec-head .grow { flex: 1; min-width: 120px; }
.sec-body { padding: 14px; display: grid; gap: 12px; }
.q { display: grid; gap: 8px; padding: 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.q-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.q-top .qn { font-weight: 700; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lvl { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--surface); }
.lvl button { border: 0; background: none; font-size: 11px; font-weight: 600; padding: 3px 9px; color: var(--muted); cursor: pointer; }
.lvl button[aria-pressed="true"].inicial { background: var(--ok-soft); color: var(--ok); }
.lvl button[aria-pressed="true"].intermedio { background: var(--warn-soft); color: var(--warn); }
.lvl button[aria-pressed="true"].avanzado { background: var(--accent-soft); color: var(--accent-text); }
.opts { display: grid; gap: 6px; }
.opt-row { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; }
.opt-row input[type=radio] { accent-color: var(--accent); }
.rub-grid { overflow-x: auto; }
.rub-grid table { border-collapse: separate; border-spacing: 6px; min-width: 760px; width: 100%; }
.rub-grid th { font-size: 11.5px; text-align: left; color: var(--muted); font-weight: 600; }
.rub-grid td { vertical-align: top; }
.rub-grid .ta { min-height: 92px; font-size: 12.5px; }
.chk-list { display: grid; gap: 8px; }
.chk-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
.chk-row .ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.chk-row .ico svg { width: 13px; height: 13px; }
.chk-row.ok .ico { background: var(--ok-soft); color: var(--ok); }
.chk-row.warn .ico { background: var(--warn-soft); color: var(--warn); }
.chk-row.bad .ico { background: var(--bad-soft); color: var(--bad); }
.chk-row b { font-size: 13px; display: block; } .chk-row span { font-size: 12.5px; color: var(--muted); }
.dist { display: grid; gap: 8px; }
.dist-bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.dist-bar i { display: block; height: 100%; }
.dist-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.dist-legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--c); }
.score-strip { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
.score-strip > div { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.score-strip .v { font-family: var(--f-display); font-size: 24px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.score-strip .l { font-size: 11.5px; color: var(--muted); font-weight: 600; }
@media (max-width: 520px) { .score-strip { grid-template-columns: repeat(2, minmax(0,1fr)); } }

/* Vista previa de hoja (réplica del formato Word) */
.paper-wrap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 10px; }
.paper-stage { background: var(--stage); border-radius: 12px; padding: 18px; max-height: calc(100vh - 120px); overflow: auto; }
.paper-scale { transform-origin: 0 0; }
.paper { width: 816px; background: #fff; color: #000; font-family: var(--f-doc); font-size: 14.67px; line-height: 1.22; padding: 75.6px; box-shadow: var(--paper-shadow); }
.paper.a4 { width: 794px; }
.paper p { margin: 0 0 4px; }
.paper .ph { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
.paper .ph td { border: 1px solid #000; padding: 3px 7px; vertical-align: middle; font-size: 14.67px; }
.paper .ph .c1 { width: 31.5%; } .paper .ph .c3 { width: 24%; } .paper .ph .c2 { text-align: center; }
.paper .ph .logo { float: left; width: 36px; height: auto; margin: 1px 10px 2px 0; }
.paper .b { font-weight: 700; } .paper .i { font-style: italic; }
.paper .sec { font-weight: 700; margin: 16px 0 4px; }
.paper .ins { font-style: italic; margin-bottom: 8px; }
.paper .ql { margin: 8px 0 2px 24px; text-indent: -24px; }
.paper .opt { margin: 0 0 0 48px; }
.paper .line { border-bottom: 1px solid #555; height: 22px; margin-top: 4px; }
.paper .jb { text-align: justify; }
.paper ul.chk { list-style: none; margin: 0 0 4px; padding: 0 0 0 48px; }
.paper ul.chk li { position: relative; }
.paper ul.chk li::before { content: "✓"; position: absolute; left: -24px; }
.paper table.t { width: 100%; border-collapse: collapse; margin: 4px 0 6px; }
.paper table.t td, .paper table.t th { border: 1px solid #000; padding: 3px 6px; vertical-align: top; }
.paper table.t th { background: #ed7d31; color: #fff; font-size: 12px; text-align: center; vertical-align: middle; }
.paper table.t td.k { background: #fbe4d5; font-weight: 700; }
.paper table.t.small td { font-size: 12px; }
.paper .box { background: #f2f2f2; border: 1px solid #000; padding: 8px 10px; text-align: justify; margin-bottom: 8px; }
.paper .bands td { text-align: center; font-weight: 700; }
.paper .center { text-align: center; }
.paper .paper-note { color: #888; font-size: 11px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100vw - 32px); }
.review { display: grid; gap: 10px; }
.review .rv { padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); display: grid; gap: 4px; font-size: 13px; }
.review .rv .s { font-size: 12.5px; color: var(--ink-2); }
.split { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.oa-bank { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
@media (max-width: 420px) { .oa-bank { grid-template-columns: 1fr; } }
.oa-card { display: grid; gap: 12px; align-content: start; }
.oa-card .tx { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }
.verify { font-size: 11.5px; color: var(--warn); }

.eyebrow.org { color: var(--orange-text); }
.kpi.hl { border-top: 3px solid var(--orange); }

/* Glosario técnico */
.gl { margin: 8px 0 0; display: grid; gap: 0 48px; }
.gl.two { grid-template-columns: 1fr 1fr; }
.gl-i { border-top: 3px solid var(--s-acc); padding: 14px 0 16px; display: grid; gap: 6px; }
.gl dt { font-weight: 800; font-size: 26px; color: var(--s-acc); }
.gl dd { margin: 0; font-size: 21px; line-height: 1.4; color: var(--s-ink); }
.gl.two dd { font-size: 18px; } .gl.two dt { font-size: 22px; }

/* Estilo Cómic (original: tramado, contornos gruesos y globos) */
.th-comic { --s-bg: #fff6e0; --s-ink: #111; --s-muted: #3b3b3b; --s-acc: #e2231a; --s-acc2: #0077c8; --s-card: #fff; --s-line: #111; --s-tf: "Bangers", Impact, sans-serif; --s-tt: uppercase; --s-tw: 400; --s-ls: .02em;
  background-image: radial-gradient(rgba(226,35,26,.16) 2.2px, transparent 2.6px); background-size: 18px 18px; }
.th-comic .s-title, .th-comic .s-mega, .th-comic .q-title, .th-comic .d-lab { color: #fff; -webkit-text-stroke: 3px #111; paint-order: stroke fill; text-shadow: 6px 6px 0 #111; }
.th-comic .s-title { font-size: 72px; }
.th-comic.ly-portada .s-mega { font-size: 124px; color: var(--s-acc2); max-width: 760px; }
.th-comic.ly-portada .p-wrap { max-width: 760px; }
.th-comic .s-card { border: 5px solid #111; border-radius: 10px; box-shadow: 10px 10px 0 #111; }
.th-comic .s-kicker { display: inline-block; justify-self: start; align-self: flex-start; background: #ffd400; color: #111; border: 4px solid #111; padding: 4px 14px; transform: rotate(-2deg); box-shadow: 5px 5px 0 #111; letter-spacing: .06em; }
.th-comic .s-lead, .th-comic .s-body { background: #fff; border: 4px solid #111; border-radius: 26px; padding: 18px 24px; position: relative; color: #111; }
.th-comic .c-hl, .th-comic .t-head { border: 5px solid #111; box-shadow: 10px 10px 0 #111; }
.th-comic .c-hl-v { color: #fff; -webkit-text-stroke: 2px #111; paint-order: stroke fill; }
.th-comic .t-card { border: 5px solid #111; box-shadow: 10px 10px 0 #111; }
.th-comic .t-card::before, .th-comic .t-card::after { display: none; }
.th-comic .st-dot { border: 4px solid #111; }
.th-comic .s-foot { color: #111; }
.th-comic .d-val { color: var(--s-acc); -webkit-text-stroke: 4px #111; paint-order: stroke fill; text-shadow: 10px 10px 0 #111; }

/* Estilo Manga (original: líneas de velocidad, tinta, viñetas) */
.th-manga { --s-bg: #fafaf7; --s-ink: #0b0b0f; --s-muted: #45454d; --s-acc: #144c99; --s-acc2: #dd7d0c; --s-card: #fff; --s-line: #0b0b0f; --s-tf: "Anton", Impact, sans-serif; --s-tt: uppercase; --s-tw: 400; --s-ls: .01em; }
.th-manga .s-title, .th-manga .s-mega, .th-manga .q-title { transform: skew(-6deg); }
.th-manga .s-mega { font-size: 130px; text-shadow: 6px 6px 0 var(--s-acc2); }
.th-manga .s-title { text-shadow: 4px 4px 0 rgba(221,125,12,.55); }
.th-manga .s-card { border: 4px solid #0b0b0f; border-radius: 0; box-shadow: none; }
.th-manga .s-kicker { background: #0b0b0f; color: #fff; padding: 4px 14px; align-self: flex-start; transform: skew(-8deg); }
.th-manga.ly-portada .s-chip { background: #0b0b0f; color: #fff; border-color: #0b0b0f; border-radius: 0; transform: skew(-8deg); }
.th-manga .c-hl { border-radius: 0; border: 5px solid #0b0b0f; background: #0b0b0f; color: #fff; }
.th-manga .t-card { border: 4px solid #0b0b0f; border-radius: 0; }
.th-manga .t-head { background: #0b0b0f; color: #fff; }
.th-manga .tick { background: var(--s-acc2); }
.th-manga .l-n, .th-manga .d-val { color: var(--s-acc2); -webkit-text-stroke: 2px #0b0b0f; paint-order: stroke fill; }

/* Estilo Arcade (original: píxeles y barras de energía) */
.th-arcade { --s-bg: #0d0a26; --s-ink: #edebff; --s-muted: #a49fd6; --s-acc: #ffe14d; --s-acc2: #3cf2c5; --s-card: #1b1645; --s-line: #3cf2c5; --s-tf: "Press Start 2P", "Courier New", monospace; --s-tt: uppercase; --s-tw: 400; --s-ls: 0;
  background-image: linear-gradient(rgba(60,242,197,.06) 2px, transparent 2px), linear-gradient(90deg, rgba(60,242,197,.06) 2px, transparent 2px); background-size: 40px 40px; }
.th-arcade .s-title { font-size: 38px; line-height: 1.35; text-shadow: 4px 4px 0 #e2231a; }
.th-arcade.ly-portada .s-mega { font-size: 64px; line-height: 1.3; text-shadow: 6px 6px 0 #e2231a; }
.th-arcade .q-title { font-size: 44px; line-height: 1.35; }
.th-arcade .s-kicker { font-family: "Press Start 2P", monospace; font-size: 15px; letter-spacing: 0; }
.th-arcade .s-card { border-radius: 0; border: 4px solid var(--s-acc2); box-shadow: 6px 6px 0 #000; }
.th-arcade .c-hl { border-radius: 0; box-shadow: 8px 8px 0 #000; }
.th-arcade .c-hl-v { font-size: calc(var(--hs, 92px) * .5); line-height: 1.3; }
.th-arcade .d-val { font-size: 120px; line-height: 1.1; }
.th-arcade .d-lab, .th-arcade .cmp-col h3, .th-arcade .a-v { font-size: 22px; line-height: 1.4; }
.th-arcade .l-n, .th-arcade .st-dot { font-size: 20px; }
.th-arcade .t-head h2 { font-size: 30px; line-height: 1.3; }
.th-arcade .t-card { border-radius: 0; border: 4px solid var(--s-acc2); }
.th-arcade .t-card::before, .th-arcade .t-card::after { border-radius: 0; }
.th-arcade .qt blockquote { font-size: 30px; line-height: 1.5; }
.th-arcade .tick { border-radius: 0; }
.th-arcade.ly-portada .s-chip { border-radius: 0; font-family: "Press Start 2P", monospace; font-size: 14px; }

.br-steps { margin: 0; padding-left: 22px; display: grid; gap: 16px; }
.br-steps li { display: block; line-height: 1.5; }
.br-steps li .ta { margin-top: 8px; }
.br-steps li::marker { font-weight: 800; color: var(--orange-text); }

</style>

/* ===== Núcleo de cálculo: puntajes, notas y tramos (Reglamento LBPO 2026, art. 4.6 / 6.2 / 15.4) ===== */
const Core = (() => {
  const SECTION_LABELS = {
    texto: 'Texto / introducción teórica',
    seleccion: 'Selección única',
    vf: 'Verdadero o falso',
    desarrollo: 'Preguntas de desarrollo',
    comprension: 'Comprensión lectora',
    pareados: 'Términos pareados',
    completar: 'Completación'
  };
  const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

  function num(v, d = 0) { const n = Number(v); return Number.isFinite(n) ? n : d; }

  function sectionPoints(s) {
    const qs = s.questions || [];
    switch (s.type) {
      case 'seleccion': case 'vf': case 'completar': return qs.length * num(s.points, 1);
      case 'desarrollo': case 'comprension': return qs.reduce((a, q) => a + num(q.points, 0), 0);
      case 'pareados': return (s.pairs || []).length * num(s.points, 1);
      default: return 0;
    }
  }

  function scaleMax(cols) { return Math.max(0, ...(cols || []).map(c => num(c.points, 0))); }

  function totalPoints(inst) {
    if (inst.type === 'rubrica') {
      const r = inst.rubric || { levels: [], criteria: [] };
      return (r.criteria || []).length * scaleMax(r.levels);
    }
    if (['cotejo', 'apreciacion', 'autoeval', 'coeval'].includes(inst.type)) {
      const c = inst.checklist || { cols: [], items: [] };
      return (c.items || []).length * scaleMax(c.cols);
    }
    return (inst.sections || []).reduce((a, s) => a + sectionPoints(s), 0);
  }

  function cutPoints(max, exig) { return Math.round(max * num(exig, 60) / 100); }

  function grade(p, max, exig) {
    const cut = cutPoints(max, exig);
    if (max <= 0) return 1;
    let n;
    if (p < cut) n = 1 + 3 * p / Math.max(cut, 1);
    else n = 4 + 3 * (p - cut) / Math.max(max - cut, 1);
    n = Math.min(7, Math.max(1, n));
    return Math.round(n * 10) / 10;
  }

  function fmtGrade(n) { return n.toFixed(1).replace('.', ','); }

  // Tramos MB / B / S / I expresados en puntaje (MB 6,0-7,0 · B 5,0-5,9 · S 4,0-4,9 · I 1,0-3,9)
  function bands(max, exig) {
    const cut = cutPoints(max, exig);
    const span = max - cut;
    let b = Math.ceil(cut + span / 3 - 1e-9);
    let mb = Math.ceil(cut + 2 * span / 3 - 1e-9);
    if (mb > max) mb = max;
    if (b >= mb) b = Math.max(cut, mb - 1);
    return [
      { key: 'MB', label: 'Muy bueno', from: mb, to: max },
      { key: 'B', label: 'Bueno', from: b, to: Math.max(b, mb - 1) },
      { key: 'S', label: 'Suficiente', from: cut, to: Math.max(cut, b - 1) },
      { key: 'I', label: 'Insuficiente', from: 0, to: Math.max(0, cut - 1) }
    ];
  }

  function gradeTable(max, exig) {
    const rows = [];
    for (let p = 0; p <= max; p++) rows.push({ p, n: grade(p, max, exig) });
    return rows;
  }

  // Distribución de reactivos por nivel de habilidad (art. 15.4: 50% inicial, 30% intermedia, 20% avanzada)
  function levelDistribution(inst) {
    const d = { inicial: 0, intermedio: 0, avanzado: 0 };
    let total = 0;
    (inst.sections || []).forEach(s => {
      (s.questions || []).forEach(q => { const l = q.level || 'inicial'; if (d[l] !== undefined) { d[l]++; total++; } });
    });
    return { ...d, total, pct: k => total ? Math.round(d[k] * 100 / total) : 0 };
  }

  function sectionTitle(s, idx) {
    const pts = sectionPoints(s);
    return `ÍTEM ${ROMAN[idx] || idx + 1}: ${(s.title || SECTION_LABELS[s.type] || '').toUpperCase()} (${pts} ${pts === 1 ? 'pto' : 'ptos'})`;
  }

  // Fecha límite de entrega a Evaluación (art. 15.3: 72 horas hábiles = 3 días hábiles antes)
  function deliveryDeadline(dateStr) {
    if (!dateStr) return null;
    const d = new Date(dateStr + 'T12:00:00');
    if (isNaN(d)) return null;
    let n = 3;
    while (n > 0) { d.setDate(d.getDate() - 1); const w = d.getDay(); if (w !== 0 && w !== 6) n--; }
    return d;
  }

  return { SECTION_LABELS, ROMAN, sectionPoints, totalPoints, cutPoints, grade, fmtGrade, bands, gradeTable, levelDistribution, sectionTitle, deliveryDeadline, scaleMax };
})();

/* ===== Generador Word (.docx) con el formato institucional del LBPO =====
   Réplica del formato de los instrumentos del departamento: Calibri 11, márgenes 2 cm,
   hoja Oficio (21,6 × 35,6 cm), Carta o A4, encabezado 3×2 con insignia. */
const DocxBuilder = (() => {
  const PAPER = {
    oficio: { w: 12240, h: 20160, code: 5 },
    carta: { w: 12240, h: 15840, code: 1 },
    a4: { w: 11906, h: 16838, code: 9 }
  };
  const MARGIN = 1134;
  const ORANGE = 'ED7D31', ORANGE_LIGHT = 'FBE4D5', GREY = 'F2F2F2';

  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // ---- runs & paragraphs ----
  function run(text, o = {}) {
    let rpr = '';
    if (o.font) rpr += `<w:rFonts w:ascii="${o.font}" w:hAnsi="${o.font}" w:cs="${o.font}"/>`;
    if (o.b) rpr += '<w:b/><w:bCs/>';
    if (o.i) rpr += '<w:i/><w:iCs/>';
    if (o.u) rpr += '<w:u w:val="single"/>';
    if (o.color) rpr += `<w:color w:val="${o.color}"/>`;
    if (o.sz) rpr += `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`;
    if (o.caps) rpr += '<w:caps/>';
    if (o.vert) rpr += `<w:vertAlign w:val="${o.vert}"/>`;
    const parts = String(text ?? '').split('\n');
    return parts.map((t, i) => `<w:r>${rpr ? `<w:rPr>${rpr}</w:rPr>` : ''}${i ? '<w:br/>' : ''}<w:t xml:space="preserve">${esc(t)}</w:t></w:r>`).join('');
  }
  // **negrita** y *cursiva* en línea
  function rich(text, o = {}) {
    const out = [];
    const re = /(\*\*[^*]+\*\*|\*[^*\s][^*]*\*)/g;
    let last = 0, m;
    const s = String(text ?? '');
    while ((m = re.exec(s))) {
      if (m.index > last) out.push(run(s.slice(last, m.index), o));
      const tok = m[0];
      if (tok.startsWith('**')) out.push(run(tok.slice(2, -2), { ...o, b: true }));
      else out.push(run(tok.slice(1, -1), { ...o, i: true }));
      last = m.index + tok.length;
    }
    if (last < s.length) out.push(run(s.slice(last), o));
    return out.join('');
  }
  function para(content, o = {}) {
    let ppr = '';
    if (o.style) ppr += `<w:pStyle w:val="${o.style}"/>`;
    if (o.keepNext) ppr += '<w:keepNext/>';
    if (o.pageBreakBefore) ppr += '<w:pageBreakBefore/>';
    if (o.border) ppr += `<w:pBdr><w:bottom w:val="single" w:sz="4" w:space="1" w:color="808080"/></w:pBdr>`;
    if (o.tabs) ppr += `<w:tabs>${o.tabs.map(t => `<w:tab w:val="${t.val || 'left'}"${t.leader ? ` w:leader="${t.leader}"` : ''} w:pos="${t.pos}"/>`).join('')}</w:tabs>`;
    const sp = { before: o.before ?? 0, after: o.after ?? 60, line: o.line ?? 259 };
    ppr += `<w:spacing w:before="${sp.before}" w:after="${sp.after}" w:line="${sp.line}" w:lineRule="auto"/>`;
    if (o.ind) ppr += `<w:ind w:left="${o.ind.left || 0}"${o.ind.hanging ? ` w:hanging="${o.ind.hanging}"` : ''}${o.ind.right ? ` w:right="${o.ind.right}"` : ''}/>`;
    if (o.jc) ppr += `<w:jc w:val="${o.jc}"/>`;
    return `<w:p><w:pPr>${ppr}</w:pPr>${content || ''}</w:p>`;
  }
  const empty = (after = 0) => para('', { after });

  // ---- tables ----
  function cell(content, o = {}) {
    let tcpr = `<w:tcW w:w="${o.w}" w:type="dxa"/>`;
    if (o.span) tcpr += `<w:gridSpan w:val="${o.span}"/>`;
    if (o.vMerge) tcpr += o.vMerge === 'restart' ? '<w:vMerge w:val="restart"/>' : '<w:vMerge/>';
    if (o.fill) tcpr += `<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>`;
    if (o.noBorder) tcpr += '<w:tcBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/></w:tcBorders>';
    tcpr += `<w:vAlign w:val="${o.vAlign || 'center'}"/>`;
    const body = Array.isArray(content) ? content.join('') : content;
    return `<w:tc><w:tcPr>${tcpr}</w:tcPr>${body || para('', { after: 0 })}</w:tc>`;
  }
  function table(rows, widths, o = {}) {
    const total = widths.reduce((a, b) => a + b, 0);
    const bc = o.borderColor || 'auto';
    const borders = o.noBorders ? '<w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders>'
      : `<w:tblBorders>${['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(k => `<w:${k} w:val="single" w:sz="4" w:space="0" w:color="${bc}"/>`).join('')}</w:tblBorders>`;
    const tblPr = `<w:tblPr><w:tblW w:w="${total}" w:type="dxa"/><w:tblInd w:w="${o.ind ?? -5}" w:type="dxa"/>${borders}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="${o.padV ?? 30}" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="${o.padV ?? 30}" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar><w:tblLook w:val="04A0"/></w:tblPr>`;
    const grid = `<w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`;
    const trs = rows.map(r => {
      const trpr = (r.header ? '<w:tblHeader/>' : '') + (r.height ? `<w:trHeight w:val="${r.height}"/>` : '') + (r.cantSplit !== false ? '<w:cantSplit/>' : '');
      return `<w:tr>${trpr ? `<w:trPr>${trpr}</w:trPr>` : ''}${r.cells.join('')}</w:tr>`;
    }).join('');
    return `<w:tbl>${tblPr}${grid}${trs}</w:tbl>`;
  }

  // ---- insignia flotante (igual a los documentos originales) ----
  function logoDrawing(id) {
    const cx = 350700, cy = 459600;
    return `<w:r><w:rPr><w:noProof/></w:rPr><w:drawing><wp:anchor distT="0" distB="0" distL="114300" distR="114300" simplePos="0" relativeHeight="251659264" behindDoc="0" locked="0" layoutInCell="1" allowOverlap="1"><wp:simplePos x="0" y="0"/><wp:positionH relativeFrom="column"><wp:posOffset>43815</wp:posOffset></wp:positionH><wp:positionV relativeFrom="paragraph"><wp:posOffset>30005</wp:posOffset></wp:positionV><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:wrapSquare wrapText="bothSides"/><wp:docPr id="${id}" name="Insignia LBPO" descr="Insignia Liceo Bicentenario Politécnico de Ovalle"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="Insignia LBPO"/><pic:cNvPicPr><a:picLocks noChangeAspect="1"/></pic:cNvPicPr></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdLogo"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr bwMode="auto"><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:anchor></w:drawing></w:r>`;
  }

  // ---- encabezado institucional 3×2 ----
  function header(inst, W) {
    const w1 = Math.round(W * 0.315), w3 = Math.round(W * 0.24), w2 = W - w1 - w3;
    const P = (c, o = {}) => para(c, { after: 0, line: 240, ...o });
    const curso = `CURSO: ${inst.courseLabel ? inst.courseLabel : ''}${'_'.repeat(inst.courseLabel ? 6 : 10)}`;
    const c1 = cell([P(logoDrawing(1) + run('LICEO BICENTENARIO POLITÉCNICO DE OVALLE'))], { w: w1 });
    const titleLines = [P(run(inst.title || 'Educación Física y Salud', { sz: inst.subtitle ? 22 : 26 }), { jc: 'center' })];
    if (inst.subtitle) titleLines.push(P(run(inst.subtitle), { jc: 'center' }));
    const c2 = cell(titleLines, { w: w2 });
    const c3lines = [P(run(curso))];
    if (inst.showLista !== false) { c3lines.push(P('')); c3lines.push(P(run('Nº DE LISTA: ________'))); }
    const c3 = cell(c3lines, { w: w3 });
    const tipo = inst.type === 'ticket' ? 'TICKET DE SALIDA' : `EVALUACIÓN ${String(inst.character || 'Formativa').toUpperCase()}`;
    const r2 = [
      cell([P(run('DEPARTAMENTO')), P(run('DE EDUCACIÓN FÍSICA'))], { w: w1 }),
      cell([P(run(tipo), { jc: 'center' })], { w: w2 }),
      cell([P(run('Fecha: ___/___/___'))], { w: w3 })
    ];
    return table([{ cells: [c1, c2, c3], height: 820 }, { cells: r2 }], [w1, w2, w3]);
  }

  function bullets(list, sym = '✓') {
    return list.filter(Boolean).map(t => para(run(sym + '\t') + rich(t), { after: 0, ind: { left: 720, hanging: 360 }, tabs: [{ pos: 720 }] })).join('');
  }

  let LINE_W = 9900;
  function answerLines(n) {
    let x = '';
    for (let i = 0; i < n; i++) x += para('<w:r><w:tab/></w:r>', { after: 0, before: 100, line: 300, tabs: [{ val: 'right', leader: 'underscore', pos: LINE_W }] });
    return x;
  }

  function bandsTable(inst, W, max) {
    const b = Core.bands(max, inst.exigencia);
    const w = Math.floor(W / 4);
    const cells = b.map(x => cell([para(run(`${x.key} = ${x.from === x.to ? x.from : `${x.to} a ${x.from}`} ${x.from === 1 && x.to === 1 ? 'pto' : 'ptos'}`, { b: true }), { after: 0, jc: 'center' })], { w }));
    return table([{ cells }], [w, w, w, w]);
  }

  // ---- secciones de prueba ----
  function sectionXml(s, idx, W, ctx) {
    let x = '';
    const title = s.type === 'texto' ? (s.title || 'Introducción').toUpperCase() : Core.sectionTitle(s, ctx.itemIdx++);
    x += para(run(title, { b: true }), { before: 240, after: 60, keepNext: true });
    if (s.instruction && s.type !== 'texto') x += para(run('Instrucción: ', { i: true, b: true }) + rich(s.instruction, { i: true }), { after: 120, keepNext: true });

    const qs = s.questions || [];
    switch (s.type) {
      case 'texto': {
        String(s.body || '').split('\n').forEach(line => {
          const t = line.trim();
          if (!t) return;
          if (/^[-•]\s+/.test(t)) x += para(run('•\t') + rich(t.replace(/^[-•]\s+/, '')), { after: 20, ind: { left: 720, hanging: 360 }, tabs: [{ pos: 720 }] });
          else if (/^\d+[.)]\s+/.test(t)) { const m = t.match(/^(\d+[.)])\s+(.*)$/); x += para(run(m[1] + '\t') + rich(m[2]), { after: 20, ind: { left: 720, hanging: 360 }, tabs: [{ pos: 720 }] }); }
          else if (/^#+\s+/.test(t)) x += para(rich('**' + t.replace(/^#+\s+/, '') + '**'), { before: 80, after: 20, keepNext: true });
          else x += para(rich(t), { after: 80, jc: 'both' });
        });
        break;
      }
      case 'seleccion':
        qs.forEach((q, i) => {
          x += para(run(`${i + 1}. `, { b: true }) + rich(q.q, { b: true }), { before: 120, after: 40, keepNext: true, ind: { left: 360, hanging: 360 } });
          (q.options || []).forEach((o, j) => {
            x += para(run(`${'abcdefg'[j]}) `) + rich(o), { after: 0, ind: { left: 720 }, keepNext: j < q.options.length - 1 });
          });
        });
        break;
      case 'vf': {
        if (s.layout === 'linea') {
          qs.forEach((q, i) => x += para(run(`${i + 1}.  ______  `) + rich(q.q), { after: 80, ind: { left: 360, hanging: 360 } }) + (s.justify ? answerLines(1) : ''));
        } else {
          const wv = 560, wq = W - 2 * wv;
          const rows = qs.map((q, i) => ({ cells: [
            cell([para(run(`${i + 1}. `, { b: true }) + rich(q.q), { after: 0 })], { w: wq }),
            cell([para(run('V', { b: true }), { after: 0, jc: 'center' })], { w: wv }),
            cell([para(run('F', { b: true }), { after: 0, jc: 'center' })], { w: wv })
          ] }));
          x += table(rows, [wq, wv, wv]);
          if (s.justify) { x += para(run('Justificación de las afirmaciones falsas:', { b: true }), { before: 120, after: 0 }); x += answerLines(3); }
        }
        break;
      }
      case 'desarrollo':
        qs.forEach((q, i) => {
          x += para(run(`${i + 1}. `, { b: true }) + rich(q.q) + run(` (${q.points} ${q.points == 1 ? 'pto' : 'ptos'})`, { b: true }), { before: 160, after: 0, keepNext: true, ind: { left: 360, hanging: 360 } });
          x += answerLines(Number(q.lines) || 4);
        });
        break;
      case 'comprension': {
        if (s.textTitle) x += para(run('TEXTO: ', { b: true }) + run(`“${s.textTitle}”`, { b: true }), { after: 60, keepNext: true });
        const body = String(s.text || '').split('\n').filter(t => t.trim()).map(t => para(rich(t.trim()), { after: 60, jc: 'both' }));
        x += table([{ cells: [cell(body, { w: W, fill: GREY })], cantSplit: false }], [W], { padV: 100 });
        x += para(run('PREGUNTAS:', { b: true }), { before: 160, after: 0, keepNext: true });
        qs.forEach((q, i) => {
          x += para(run(`${i + 1}. `, { b: true }) + rich(q.q) + run(` (${q.points} ${q.points == 1 ? 'pto' : 'ptos'})`, { b: true }), { before: 120, after: 0, keepNext: true, ind: { left: 360, hanging: 360 } });
          x += answerLines(Number(q.lines) || 3);
        });
        break;
      }
      case 'pareados': {
        const pairs = s.pairs || [];
        const order = ctx.shuffle(pairs.map((_, i) => i), s.seed || 7);
        const wn = 600, wc = Math.floor((W - 2 * wn) / 2);
        const rows = [{ header: true, cells: [
          cell([para(run('Nº', { b: true, color: 'FFFFFF' }), { after: 0, jc: 'center' })], { w: wn, fill: ORANGE }),
          cell([para(run('COLUMNA A', { b: true, color: 'FFFFFF' }), { after: 0 })], { w: wc, fill: ORANGE }),
          cell([para(run('( )', { b: true, color: 'FFFFFF' }), { after: 0, jc: 'center' })], { w: wn, fill: ORANGE }),
          cell([para(run('COLUMNA B', { b: true, color: 'FFFFFF' }), { after: 0 })], { w: wc, fill: ORANGE })
        ] }];
        pairs.forEach((p, i) => rows.push({ cells: [
          cell([para(run(String(i + 1), { b: true }), { after: 0, jc: 'center' })], { w: wn }),
          cell([para(rich(p.a), { after: 0 })], { w: wc }),
          cell([para(run('(     )'), { after: 0, jc: 'center' })], { w: wn }),
          cell([para(rich(pairs[order[i]].b), { after: 0 })], { w: wc })
        ] }));
        x += table(rows, [wn, wc, wn, wc]);
        break;
      }
      case 'completar':
        qs.forEach((q, i) => x += para(run(`${i + 1}. `, { b: true }) + rich(String(q.q).replace(/_{2,}/g, '________________')), { before: 80, after: 80, ind: { left: 360, hanging: 360 }, line: 320 }));
        break;
    }
    return x;
  }

  const graded = inst => inst.character === 'Sumativa';
  function rubricXml(inst, W) {
    const r = inst.rubric || { levels: [], criteria: [] };
    const L = r.levels || [];
    const wc = Math.round(W * 0.17), wp = 620;
    const wl = Math.floor((W - wc - wp) / Math.max(L.length, 1));
    const widths = [wc, ...L.map(() => wl), wp];
    const S = 18;
    const H = t => para(run(t, { b: true, color: 'FFFFFF', sz: S }), { after: 0, jc: 'center', line: 240 });
    const rows = [{ header: true, cells: [cell([H('CRITERIO')], { w: wc, fill: ORANGE }), ...L.map(l => cell([H(`${l.name.toUpperCase()} (${l.points} ${l.points == 1 ? 'PTO' : 'PTS'})`)], { w: wl, fill: ORANGE })), cell([H('PTJE.')], { w: wp, fill: ORANGE })] }];
    (r.criteria || []).forEach(c => rows.push({ cells: [
      cell([para(rich(c.name, { b: true, sz: S }), { after: 0, line: 240 })], { w: wc, fill: ORANGE_LIGHT }),
      ...L.map((l, j) => cell([para(rich((c.descriptors || [])[j] || '', { sz: S }), { after: 0, line: 240 })], { w: wl, vAlign: 'top' })),
      cell('', { w: wp })
    ] }));
    const span = L.length;
    rows.push({ cells: [
      cell([para(run('Puntaje total', { b: true, sz: S }), { after: 0 })], { w: wc, fill: ORANGE_LIGHT }),
      cell([para(run(graded(inst) ? 'Nota:' : 'Nivel de desempeño (MB · B · S · I):', { b: true, sz: S }), { after: 0, jc: 'right' })], { w: wl * span, span }),
      cell('', { w: wp })
    ] });
    return table(rows, widths);
  }

  function checklistXml(inst, W) {
    const c = inst.checklist || { cols: [], items: [] };
    const cols = c.cols || [];
    const wn = 520, wcol = cols.length > 2 ? 980 : 800;
    const wi = W - wn - wcol * cols.length;
    const S = 20;
    const H = t => para(run(t, { b: true, color: 'FFFFFF', sz: S }), { after: 0, jc: 'center', line: 240 });
    const rows = [{ header: true, cells: [cell([H('Nº')], { w: wn, fill: ORANGE }), cell([H(inst.type === 'cotejo' ? 'INDICADOR' : 'ASPECTO A EVALUAR')], { w: wi, fill: ORANGE }), ...cols.map(k => cell([H(`${k.name}${k.showPts === false ? '' : `\n(${k.points})`}`)], { w: wcol, fill: ORANGE }))] }];
    (c.items || []).forEach((it, i) => rows.push({ cells: [
      cell([para(run(String(i + 1), { b: true, sz: S }), { after: 0, jc: 'center' })], { w: wn, fill: ORANGE_LIGHT }),
      cell([para(rich(it.text, { sz: S }), { after: 0, line: 240 })], { w: wi }),
      ...cols.map(() => cell('', { w: wcol }))
    ] }));
    rows.push({ cells: [
      cell([para(run('Puntaje total obtenido', { b: true, sz: S }), { after: 0 })], { w: wn + wi, span: 2, fill: ORANGE_LIGHT }),
      cell([para(run(graded(inst) ? 'Nota:' : 'Nivel:', { b: true, sz: S }), { after: 0 })], { w: wcol * cols.length, span: cols.length })
    ] });
    return table(rows, [wn, wi, ...cols.map(() => wcol)]);
  }

  function gradeTableXml(inst, W, max) {
    const rows = Core.gradeTable(max, inst.exigencia);
    const groups = 5;
    const per = Math.ceil(rows.length / groups);
    const w = Math.floor(W / (groups * 2));
    const out = [{ header: true, cells: [] }];
    for (let g = 0; g < groups; g++) out[0].cells.push(
      cell([para(run('Ptje.', { b: true, sz: 18, color: 'FFFFFF' }), { after: 0, jc: 'center' })], { w, fill: ORANGE }),
      cell([para(run('Nota', { b: true, sz: 18, color: 'FFFFFF' }), { after: 0, jc: 'center' })], { w, fill: ORANGE }));
    for (let r = 0; r < per; r++) {
      const cells = [];
      for (let g = 0; g < groups; g++) {
        const it = rows[g * per + r];
        const fail = it && it.n < 4;
        cells.push(cell([para(run(it ? String(it.p) : '', { sz: 18 }), { after: 0, jc: 'center', line: 200 })], { w, fill: it ? GREY : undefined }));
        cells.push(cell([para(run(it ? Core.fmtGrade(it.n) : '', { sz: 18, color: fail ? 'C00000' : '1F3864', b: true }), { after: 0, jc: 'center', line: 200 })], { w }));
      }
      out.push({ cells });
    }
    return table(out, Array(groups * 2).fill(w), { padV: 0 });
  }

  function keyXml(inst, W) {
    let x = para(run('PAUTA DE CORRECCIÓN (USO DOCENTE / EVALUACIÓN)', { b: true, sz: 24 }), { pageBreakBefore: true, after: 120 });
    let k = 0;
    (inst.sections || []).forEach(s => {
      if (s.type === 'texto') return;
      x += para(run(Core.sectionTitle(s, k++), { b: true }), { before: 160, after: 40 });
      const lvl = q => q.level ? ` [${q.level}]` : '';
      (s.questions || []).forEach((q, i) => {
        let ans = '';
        if (s.type === 'seleccion') ans = `${'abcdefg'[q.answer ?? 0]}) ${(q.options || [])[q.answer ?? 0] || ''}`;
        else if (s.type === 'vf') ans = q.answer ? 'V' : `F${q.justification ? ' — ' + q.justification : ''}`;
        else ans = q.answer || q.criteria || '(respuesta abierta)';
        x += para(run(`${i + 1}. `, { b: true }) + rich(ans) + run(lvl(q), { i: true, color: '7F7F7F', sz: 18 }), { after: 20, ind: { left: 360, hanging: 360 } });
      });
      if (s.type === 'pareados') {
        const order = shuffle((s.pairs || []).map((_, i) => i), s.seed || 7);
        const ans = (s.pairs || []).map((p, i) => `${order.indexOf(i) + 1}`);
        x += para(run('Columna B (de arriba hacia abajo): ') + run(order.map(o => o + 1).join(' – '), { b: true }), { after: 20 });
      }
    });
    return x;
  }

  // barajado determinista (para términos pareados)
  function shuffle(arr, seed) {
    const a = arr.slice();
    let s = seed;
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    if (a.length > 1 && a.every((v, i) => v === i)) a.push(a.shift());
    return a;
  }

  function documentXml(inst, opts) {
    const pg = PAPER[inst.paper] || PAPER.oficio;
    const W = pg.w - 2 * MARGIN;
    LINE_W = W - 60;
    const max = Core.totalPoints(inst);
    const cut = Core.cutPoints(max, inst.exigencia);
    let b = header(inst, W);
    b += empty(0);
    if (inst.showNombre !== false) b += para(run('Nombre: ') + run('_'.repeat(inst.paper === 'a4' ? 78 : 82)), { before: 60, after: 160 });
    if (inst.showOA !== false && inst.oa && inst.oa.text) b += para(run(`${inst.oa.code ? inst.oa.code : 'OA'}: `, { b: true }) + rich(inst.oa.text, { b: true }), { after: 120, jc: 'both' });
    if (inst.evalObjective) b += para(run('OBJETIVO DE EVALUACIÓN: ', { b: true }) + rich(inst.evalObjective), { after: 120, jc: 'both' });
    const ind = (inst.indicators || []).filter(Boolean);
    if (ind.length) {
      b += para(run('INDICADORES DE EVALUACIÓN:', { b: true }), { after: 20, keepNext: true });
      ind.forEach(t => b += para(rich(t), { after: 40, jc: 'both' }));
      b += empty(0);
    }
    const ins = (inst.instructions || []).filter(Boolean);
    if (ins.length) {
      b += para(run('INSTRUCCIONES:', { b: true }), { after: 20, keepNext: true });
      b += bullets(ins);
    }
    if (inst.type !== 'ticket') {
      b += para(run('Para que identifique el nivel de desempeño de los aprendizajes, considere lo siguiente:'), { before: 60, after: 20 });
      b += para(run(`PUNTAJE TOTAL: ${max} ${max === 1 ? 'pto' : 'ptos'}.`, { b: true, sz: 24 }), { after: 0 });
      b += para(run(`Con el ${inst.exigencia || 60}% de exigencia = ${cut} ptos${graded(inst) ? ' (nota 4,0)' : ''}`, { b: true, sz: 24 }), { after: 80 });
      b += bandsTable(inst, W, max);
    } else {
      b += para(run(`PUNTAJE TOTAL: ${max} ptos.`, { b: true }), { after: 60 });
    }
    b += empty(0);

    if (inst.type === 'rubrica') {
      if (inst.rubricTitle !== '') b += para(run(`RÚBRICA DE DESEMPEÑO: ${(inst.rubricTitle || inst.subtitle || inst.title || '').toUpperCase()}`, { b: true }), { before: 120, after: 80 });
      b += rubricXml(inst, W);
    } else if (['cotejo', 'apreciacion', 'autoeval', 'coeval'].includes(inst.type)) {
      const names = { cotejo: 'LISTA DE COTEJO', apreciacion: 'ESCALA DE APRECIACIÓN', autoeval: 'PAUTA DE AUTOEVALUACIÓN', coeval: 'PAUTA DE COEVALUACIÓN' };
      b += para(run(`${names[inst.type]}: ${(inst.subtitle || inst.title || '').toUpperCase()}`, { b: true }), { before: 120, after: 80 });
      if (inst.type === 'coeval') b += para(run('Nombre del compañero(a) evaluado(a): ') + run('_'.repeat(48)), { after: 120 });
      b += checklistXml(inst, W);
    } else {
      const ctx = { itemIdx: 0, shuffle };
      (inst.sections || []).forEach((s, i) => b += sectionXml(s, i, W, ctx));
    }

    if (inst.observations) {
      b += para(run('OBSERVACIONES / RETROALIMENTACIÓN:', { b: true }), { before: 240, after: 0 });
      b += answerLines(3);
    }
    if (opts.gradeTable && graded(inst)) {
      b += para(run(`TABLA DE CONVERSIÓN PUNTAJE – NOTA (exigencia ${inst.exigencia || 60}%)`, { b: true }), { before: 240, after: 80, keepNext: true });
      b += gradeTableXml(inst, W, max);
    }
    if (opts.key && !['rubrica', 'cotejo', 'apreciacion', 'autoeval', 'coeval'].includes(inst.type)) b += keyXml(inst, W);

    const sect = `<w:sectPr><w:pgSz w:w="${pg.w}" w:h="${pg.h}" w:code="${pg.code}"/><w:pgMar w:top="${MARGIN}" w:right="${MARGIN}" w:bottom="${MARGIN}" w:left="${MARGIN}" w:header="709" w:footer="709" w:gutter="0"/><w:cols w:space="708"/><w:docGrid w:linePitch="360"/></w:sectPr>`;
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:wpc="http://schemas.microsoft.com/office/word/2010/wordprocessingCanvas" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>${b}${sect}</w:body></w:document>`;
  }

  const STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:eastAsia="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="es-CL" w:eastAsia="en-US" w:bidi="ar-SA"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="160" w:line="259" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style><w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:uiPriority w:val="99"/><w:semiHidden/><w:unhideWhenUsed/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style></w:styles>`;
  const CT = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`;
  const RELS = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`;
  const DOC_RELS = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/><Relationship Id="rIdLogo" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/insignia.png"/></Relationships>`;
  const SETTINGS = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:defaultTabStop w:val="708"/><w:hyphenationZone w:val="425"/><w:characterSpacingControl w:val="doNotCompress"/><w:compat><w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat></w:settings>`;

  function core(inst, author) {
    const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${esc((inst.title || '') + (inst.subtitle ? ' – ' + inst.subtitle : ''))}</dc:title><dc:creator>${esc(author || 'Departamento de Educación Física LBPO')}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`;
  }

  function b64ToBytes(b64) {
    if (typeof Buffer !== 'undefined' && typeof window === 'undefined') return Buffer.from(b64, 'base64');
    const bin = atob(b64); const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  async function build(inst, opts = {}) {
    const zip = new JSZip();
    zip.file('[Content_Types].xml', CT);

  // ---------- Exportación PowerPoint (PptxGenJS) ----------
  async function toPptx(deck, logoB64, fetchImage) {
    const pptx = new PptxGenJS();

      if (deck.theme === 'comic') sl.addShape(pptx.ShapeType.rect, { x: 0.15, y: 0.15, w: W - 0.3, h: H - 0.3, fill: { type: 'none' }, line: { color: '111111', width: 4 } });
      if (deck.theme === 'manga') for (let k = 0; k < 10; k++) sl.addShape(pptx.ShapeType.line, { x: W - 3 + k * 0.3, y: 0, w: 0.01, h: H, line: { color: '0B0B0F', width: 1, transparency: 85 } });
